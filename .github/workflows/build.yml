name: Build APK & Test Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: backend-python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov
      - name: Pytest
        working-directory: backend-python
        run: python -m pytest -q --cov=app --cov-report=term-missing
        env:
          TWELVE_DATA_API_KEY: ""

  android-debug-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Terima lisensi SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || \
          yes | "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android-app
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ci-logs"
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/last-build.log"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sniperrex-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Publikasikan APK sebagai Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SniperRex build ${{ github.run_number }}
          body: |
            APK debug otomatis dari commit ${{ github.sha }}.
            Signal only. Not financial advice.
          files: android-app/app/build/outputs/apk/debug/app-debug.apk

      # Log ditulis balik ke repo supaya error bisa dibaca tanpa akses token.
      - name: Commit log kegagalan
        if: failure()
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p ci-logs
          grep -n -A 6 -E "e: file:|error:|FAILURE:|What went wrong" ci-logs/last-build.log \
            | tail -c 40000 > ci-logs/last-failure.log || true
          git config user.name "sniperrex-ci"
          git config user.email "ci@users.noreply.github.com"
          git add ci-logs/last-failure.log
          git commit -m "ci: log kegagalan build [skip ci]" || true
          git push || true
